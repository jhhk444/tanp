# Server configuration
server.port=8080
server.tomcat.uri-encoding=UTF-8

# MySQL configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/dessert_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}

# MyBatis configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.dessertbackend.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Logging configuration
logging.level.org.example.dessertbackend.mapper=DEBUG